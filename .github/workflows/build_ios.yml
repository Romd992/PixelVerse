name: Build iOS IPA (unsigned)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS archive (no codesign)
        run: |
          flutter build ipa --release --no-codesign --verbose
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE: ""

      - name: Package IPA from xcarchive
        run: |
          set -e
          XCARCHIVE=$(find build/ios/archive -name "*.xcarchive" -type d | head -1)
          echo "xcarchive: $XCARCHIVE"
          if [ -z "$XCARCHIVE" ]; then
            echo "ERROR: No xcarchive found!"
            find build/ios -type d | head -20
            exit 1
          fi
          APP_PATH="$XCARCHIVE/Products/Applications/Runner.app"
          echo "App path: $APP_PATH"
          ls -la "$APP_PATH"
          IPA_DIR="${{ github.workspace }}/build/ipa_payload"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          rm -rf "$IPA_DIR/Payload/Runner.app/_CodeSignature"
          rm -rf "$IPA_DIR/Payload/Runner.app/Frameworks/App.framework/_CodeSignature" 2>/dev/null || true
          rm -rf "$IPA_DIR/Payload/Runner.app/Frameworks/Flutter.framework/_CodeSignature" 2>/dev/null || true
          rm -f "$IPA_DIR/Payload/Runner.app/embedded.mobileprovision"
          IPA_PATH="${{ github.workspace }}/build/PixelVerse_v3.0.0_unsigned.ipa"
          cd "$IPA_DIR"
          zip -r "$IPA_PATH" Payload/
          cd "${{ github.workspace }}"
          echo "IPA created: $IPA_PATH"
          ls -la "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelVerse_unsigned_ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 30

      - name: Build Web (bonus)
        run: flutter build web --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelVerse_web
          path: build/web
          retention-days: 30
