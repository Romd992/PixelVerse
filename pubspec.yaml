name: pixelverse
description: "PixelVerse - A pixel-art sandbox survival crafting game (Stardew Valley style)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: 1.18.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # Player sprites
    - assets/images/player_walk.png
    - assets/images/player_idle.png
    - assets/images/player_axe.png
    - assets/images/player_pick.png
    - assets/images/player_sword.png
    # NPC sprites
    - assets/images/npc_mayor.png
    - assets/images/npc_blacksmith.png
    - assets/images/npc_shopkeeper.png
    - assets/images/npc_farmer.png
    - assets/images/npc_girl.png
    # Enemy sprites
    - assets/images/slime.png
    - assets/images/bat.png
    - assets/images/skeleton.png
    # Terrain
    - assets/images/tileset.png
    # World objects
    - assets/images/tree.png
    - assets/images/rock.png
    - assets/images/bush.png
    - assets/images/chest.png
    - assets/images/furnace.png
    - assets/images/workbench.png
    - assets/images/house.png
    - assets/images/shop.png
    - assets/images/bed.png
    # Items
    - assets/images/items.png
    # UI
    - assets/images/heart.png
    - assets/images/energy.png
    - assets/images/coin_ui.png
    # Background
    - assets/images/title_bg.png
    # Effects
    - assets/images/particle.png
